name: Wake Render backends

on:
  schedule:
    # Every hour at :37 from 09:07 to 23:07 IST (03:37-17:37 UTC).
    # GitHub often starts scheduled runs late (sometimes hours late at busy
    # times), so a few runs a day missed the window. Running hourly means a
    # late or skipped run is fixed by the next one. wake.mjs only wakes the
    # services whose window is open, and an awake service answers in seconds.
    - cron: "37 3-17 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: 'Wake just one service ("codeatlas", "contractiq") or "all"; empty = whatever is in its window now'
        required: false
        default: ""

concurrency:
  group: wake
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node wake.mjs
        env:
          ONLY: ${{ github.event.inputs.only }}